# ****************************************************************************
# NOTES:
#
# In order for this to work, you must replace STAGING_ORGANISATION below
# with the name of your staging GitHub organisation, in line 53.
# You must also replace STAGING_SITE_REPOSITORY below with the name of your
# staging site repository.
#
# For example, if your staging organisation is "my-sdg-staging-org", and your
# staging site repository is "open-sdg-site-starter", then use:
#
# curl -X POST https://api.github.com/repos/my-sdg-staging-org/open-sdg-site-starter/dispatches
#
# ****************************************************************************

name: Deploy to staging

on:
  push:
    branches:
      - develop
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

    
      - name: Test PX URLs
        run: |
          python - <<'PY'
          import yaml
          import urllib.request
          import urllib.error

          with open('indicator_id_map.yml', 'r', encoding='utf-8') as f:
              data = yaml.safe_load(f)

          failed_urls = []

          for url in data.keys():
              if not isinstance(url, str) or not url.startswith(('http://', 'https://')):
                  continue

              try:
                  req = urllib.request.Request(
                      url,
                      headers={'User-Agent': 'Mozilla/5.0'}
                  )

                  with urllib.request.urlopen(req, timeout=30) as response:
                      print(f"OK   {response.status} {url}", flush=True)

              except urllib.error.HTTPError as e:
                  print(f"FAIL HTTP {e.code}: {url}", flush=True)
                  failed_urls.append(url)

              except Exception as e:
                  print(f"FAIL {url}: {e}", flush=True)
                  failed_urls.append(url)

          print("\n--------------------------------")

          if failed_urls:
              print(f"Found {len(failed_urls)} failing URLs:")
              for url in failed_urls:
                  print(f"  {url}")
          else:
              print("All tested PX URLs responded successfully.")

          print("--------------------------------")
          PY


      - name: Build data
        run: |
          python scripts/build_data.py

      - name: Place public files
        run: |
          cp public/robots-staging.txt _site/robots.txt

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@3.7.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: _site
          CLEAN: true

      - name: Waiting 4 minutes for staging data deployment
        run: |
          sleep 240

      - name: Rebuild site
        run: |
          curl -X POST https://api.github.com/repos/hagstovan/staging-sdg-site/dispatches \
            -H "Accept: application/vnd.github.everest-preview+json" \
            -H "Authorization: token ${{ secrets.token }}" \
            --data '{"event_type":"rebuild-staging"}'
